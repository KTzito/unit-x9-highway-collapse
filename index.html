function puff(x,y,color,n=8,power=2){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-power,power),vy:rnd(-power,power),life:rnd(12,29),color,size:rnd(1,4)})}function hurt(d){if(player.inv||state!=='play')return;player.hp=Math.max(0,player.hp-d);player.inv=55;player.vx=-player.dir*2;player.vy=-2.2;shake=5;beep(110,.22,'sawtooth');puff(player.x+7,player.y+12,'#ffbca6',12);if(player.hp<=0){state='dead';sceneTime=0}}

function updatePlayer(){

function updateRescue(){sceneTime++;if(sceneTime<55)ally.y=Math.min(108,ally.y+4);if(sceneTime===60){shake=13;boss.hp=0;puff(boss.x+25,boss.y+25,'#fff09c',90,6);beep(180,.65,'sawtooth',.08,600)}if(sceneTime===110){dialogue=1;beep(780,.14)}if(sceneTime===250){dialogue=2;beep(690,.14)}if(sceneTime===410){state='clear';sceneTime=0;beep(440,.17);setTimeout(()=>beep(660,.2),180);setTimeout(()=>beep(880,.3),370)}}
function update(){t++;if(state==='play'){sceneTime++;updatePlayer();updateEnemies();updateBullets();if(player.x>1780&&stage===2)stage=3}else if(state==='rescue')updateRescue();else if(state==='dead'){sceneTime++;if(sceneTime>110){reset();state='play'}}else if(state==='clear'){sceneTime++;if(sceneTime>240){state='select';document.body.classList.remove('playing');document.getElementById('start').style.display='block';document.getElementById('start').textContent='REPLAY';document.getElementById('hint').textContent='STAGE SELECT\nHIGHWAY COLLAPSE — CLEARED'}}for(const q of particles){q.x+=q.vx;q.y+=q.vy;q.vy+=.09;q.life--}particles=particles.filter(q=>q.life>0);cam=clamp(player.x-100,0,world.end-W);if(shake>0)shake*=.83;if(shake<.25)shake=0;for(const k in pressed)pressed[k]=false}
function rect(x,y,w,h,color){G.fillStyle=color;G.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}function drawSprite(name,x,y,flip=false,scale=1){const a=atlas[name];if(!a)return;G.save();G.translate(Math.round(x),Math.round(y));if(flip){G.translate(a.width*scale,0);G.scale(-1,1)}G.drawImage(a,0,0,a.width*scale,a.height*scale);G.restore()}
function text(s,x,y,color='#fff',size=9){G.font=`bold ${size}px monospace`;G.fillStyle='#071021';G.fillText(s,x+1,y+1);G.fillStyle=color;G.fillText(s,x,y)}
function background(){rect(0,0,W,H,'#0a1530');rect(0,0,W,80,'#17254b');rect(0,69,W,45,'#27345b');for(let layer=0;layer<3;layer++){const speed=[.13,.3,.55][layer],bw=[27,21,16][layer],base=[100,116,130][layer],color=['#283b62','#324866','#344357'][layer],off=Math.floor(cam*speed);for(let i=-1;i<Math.ceil(W/bw)+2;i++){const id=i+Math.floor(off/bw),x=i*bw-off%bw,hh=12+(Math.abs((id*71+layer*37)%39));rect(x,base-hh,bw-2,hh,color);for(let y=base-hh+6;y<base;y+=9)for(let wx=4;wx<bw-3;wx+=7)if((id+y+wx)%4===0)rect(x+wx,y,2,3,'#6688a0')}}rect(0,130,W,50,'#071222');for(let x=-(cam*.8%50);x<W;x+=50)rect(x,130,1,50,'#243650')}
function drawWorld(){for(const p of platforms){if(p.y>H+40)continue;const x=p.x-cam;if(x>W||x+p.w<0)continue;rect(x,p.y,p.w,p.h,'#3c4659');rect(x,p.y,p.w,4,p.trigger?'#b0a07e':'#9da4a7');rect(x,p.y+4,p.w,4,'#66727c');for(let z=0;z<p.w;z+=12)rect(x+z,p.y+9,2,6,'#4c5969');if(p.trigger){rect(x+10,p.y+1,9,1,'#303744');rect(x+16,p.y+3,2,6,'#303744')}}for(const e of enemies)if(!e.dead)drawSprite(e.type,e.x-cam,e.y,e.type==='bike'&&player.x<e.x);if(carrier.active&&!carrier.dead)drawSprite('carrier',carrier.x-cam,carrier.y);if(boss.active&&boss.hp>0)drawSprite('vanguard',boss.x-cam,boss.y);if(ally.visible){drawSprite('saber',ally.x-cam,ally.y);if(sceneTime>50&&sceneTime<115)drawSprite('saberBlade',ally.x-cam+14,ally.y+9,false,2)}for(const b of bullets){const x=b.x-cam;const color=b.owner==='enemy'?'#ff8c7a':b.kind==='charge2'?'#d6fff6':b.kind==='charge1'?'#79f8ed':'#9afaff';rect(x,b.y,b.w,b.h,color);if(b.kind==='charge2'){rect(x+5,b.y-4,b.w-10,3,'#48a9e9');rect(x+5,b.y+b.h+1,b.w-10,3,'#48a9e9')}}if(player.inv%6<3||player.inv===0){let mode=player.dash>0?'dash':player.wall?'wall':!player.ground?(player.vy<0?'jump':'fall'):Math.abs(player.vx)>1?'run':'idle';if(player.dash>0)for(let i=1;i<=3;i++){G.globalAlpha=.14;drawSprite('unit_dash'+(Math.floor(t/4)%2),player.x-cam-player.dir*i*7,player.y,player.dir<0)}G.globalAlpha=1;drawSprite('unit_'+mode+(mode==='run'?Math.floor(player.anim/4)%8:Math.floor(player.anim/18)%2),player.x-cam,player.y,player.dir<0)}if(player.charge>28){G.strokeStyle=player.charge>80?'#ffea98':'#65d9ff';G.lineWidth=1;G.beginPath();G.arc(player.x-cam+8,player.y+13,player.charge>80?19:13,0,Math.PI*2);G.stroke()}for(const q of particles)rect(q.x-cam,q.y,q.size,q.size,q.color)}
function hud(){rect(7,7,13,73,'#0c1931');rect(9,9,9,69,'#7586a6');const n=Math.ceil(player.hp/player.max*16);for(let i=0;i<n;i++)rect(10,75-i*4,7,3,player.hp>14?'#61e68d':player.hp>7?'#f5d265':'#ff6570');text('X9',6,89,'#b5e9ff',8);const e=carrier.active&&!carrier.dead?carrier:boss.active&&boss.hp>0?boss:null;if(e){rect(93,8,135,10,'#121b31');rect(95,10,Math.max(0,131*e.hp/e.max),6,'#ed687b');text(e===carrier?'HOVER CARRIER':'VANGUARD',97,28,'#f1e8da',8)}if(state==='rescue'&&dialogue){rect(22,124,276,48,'#0b1633');G.strokeStyle='#b1d9f6';G.strokeRect(22.5,124.5,275,47);text(dialogue===1?'SABER-0: Your potential is unbroken.':'UNIT-X9: Then I will rise again.',30,145,'#e7faff',9);text(dialogue===1?'Stand up, Unit-X9. The city needs you.':'SABER-0: The next mission awaits.',30,158,'#9fd1f2',8)}if(state==='clear'){text('STAGE CLEAR',85,78,'#f8f2b4',18)}if(state==='title'){rect(0,0,W,H,'#08152f');text('UNIT-X9',74,57,'#74dcff',30);text('HIGHWAY COLLAPSE',74,80,'#f3c37b',12);text('TOUCH START OR PRESS ENTER',70,117,'#d7ecf9',9)}if(crt)for(let y=0;y<H;y+=3)rect(0,y,W,1,'#00000035')}
let last=0,acc=0;function frame(now){const dt=Math.min(100,now-last||16.67);last=now;acc+=dt;let steps=0;while(acc>=1000/60&&steps++<5){if(state!=='title'&&state!=='select')update();acc-=1000/60}G.save();if(shake)G.translate(rnd(-shake,shake),rnd(-shake,shake));background();if(state!=='title')drawWorld();G.restore();hud();requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
